name: Build PoscatNfc framework

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'ci-stubs/**'
      - 'build.sh'
      - '.github/workflows/build-ios-framework.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build framework
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Verify framework
        run: |
          file ios/PoscatNfc.framework/PoscatNfc
          plutil -p ios/PoscatNfc.framework/Info.plist
          ls -la ios/PoscatNfc.framework
      - name: Commit framework to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/PoscatNfc.framework
          if git diff --cached --quiet; then
            echo "Framework is unchanged"
          else
            git commit -m "build: PoscatNfc.framework"
            git push
          fi
      - name: Upload framework
        uses: actions/upload-artifact@v4
        with:
          name: PoscatNfc-framework
          path: ios/PoscatNfc.framework
